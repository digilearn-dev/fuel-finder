<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Cheap Fuel Near Me</title>
<style>
  /* Layout: iOS-style grouped list — large title, search field, segmented control, inset grouped rows */
  :root {
    --bg: #f2f2f7; --card: #ffffff; --label: #000000; --label-2: rgba(60,60,67,.6); --label-3: rgba(60,60,67,.3);
    --sep: rgba(60,60,67,.18); --fill: rgba(118,118,128,.12); --seg-thumb: #ffffff;
    --tint: #007aff; --good: #248a3d; --good-bg: rgba(52,199,89,.14); --warn: #c93400; --bar: rgba(242,242,247,.8);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1c1c1e; --label: #ffffff; --label-2: rgba(235,235,245,.6); --label-3: rgba(235,235,245,.3);
    --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.24); --seg-thumb: #636366;
    --tint: #0a84ff; --good: #30d158; --good-bg: rgba(48,209,88,.16); --warn: #ff9f0a; --bar: rgba(0,0,0,.75); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #1c1c1e; --label: #ffffff; --label-2: rgba(235,235,245,.6); --label-3: rgba(235,235,245,.3);
    --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.24); --seg-thumb: #636366;
    --tint: #0a84ff; --good: #30d158; --good-bg: rgba(48,209,88,.16); --warn: #ff9f0a; --bar: rgba(0,0,0,.75); color-scheme: dark; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--label); font: 17px/1.29 var(--font); letter-spacing: -0.022em;
         -webkit-font-smoothing: antialiased; }
  main { max-width: 600px; margin: 0 auto; padding-inline: 16px; padding-block: 8px 40px; display: grid; gap: 14px; }

  /* Large title */
  .titlebar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 12px; }
  h1 { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.011em; margin: 0; }
  .where { color: var(--label-2); font-size: 15px; margin-top: 2px; }

  /* Search field */
  .search { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 10px;
            padding: 0 6px 0 8px; height: 38px; }
  .search > svg { flex: 0 0 auto; color: var(--label-2); }
  .search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--label);
                  font: inherit; font-size: 17px; outline: none; letter-spacing: inherit; }
  .search input::placeholder { color: var(--label-2); }
  .icon-btn { border: 0; background: transparent; color: var(--tint); padding: 6px; border-radius: 8px;
              display: grid; place-items: center; cursor: pointer; }
  .icon-btn:focus-visible, .seg button:focus-visible, .menu:focus-visible, .row:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }

  /* Segmented control */
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--fill); border-radius: 9px; padding: 2px; position: relative; }
  .seg button { position: relative; z-index: 1; border: 0; background: transparent; color: var(--label);
                font: inherit; font-size: 13px; font-weight: 500; letter-spacing: -0.006em; padding: 6px 4px; border-radius: 7px; cursor: pointer; }
  .seg button[aria-pressed="true"] { font-weight: 600; }
  .seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / 4); border-radius: 7px;
                background: var(--seg-thumb); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04);
                transition: transform .3s cubic-bezier(.3,.7,.3,1); }

  /* Section header with radius menu */
  .section-head { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 16px 0; }
  .section-head h2 { margin: 0; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.02em; color: var(--label-2); }
  .menu { appearance: none; border: 0; background: transparent; color: var(--tint); font: inherit; font-size: 15px;
          padding: 0 13px 0 0; cursor: pointer; letter-spacing: -0.01em;
          background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
          background-position: right 4px top 55%, right 0 top 55%; background-size: 4px 4px; background-repeat: no-repeat; }

  /* Hero card */
  .hero { background: var(--card); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
  .hero .eyebrow { font-size: 13px; color: var(--good); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .hero .big { display: flex; align-items: baseline; gap: 4px; font-family: var(--font-round); }
  .hero .big b { font-size: 52px; line-height: 1; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .hero .big span { font-size: 20px; font-weight: 600; color: var(--label-2); }
  .hero .station { font-size: 17px; font-weight: 600; }
  .hero .sub { font-size: 15px; color: var(--label-2); }
  .hero .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: 15px; font-weight: 600;
          padding: 8px 14px; border-radius: 999px; background: var(--tint); color: #ffffff; }
  .pill.ghost { background: var(--fill); color: var(--tint); }
  .saving { font-size: 13px; color: var(--label-2); border-top: 0.5px solid var(--sep); padding-top: 10px; }
  .saving b { color: var(--label); font-weight: 600; }

  /* Inset grouped list */
  .group { background: var(--card); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 1fr auto 10px; gap: 12px; align-items: center; padding: 11px 16px;
         color: inherit; text-decoration: none; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 0.5px solid var(--sep); }
  .row:active { background: var(--fill); }
  .row .t { min-width: 0; }
  .row .name { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .meta { font-size: 13px; color: var(--label-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .meta .stale { color: var(--warn); }
  .row .p { text-align: right; font-family: var(--font-round); font-variant-numeric: tabular-nums; }
  .row .p b { font-size: 17px; font-weight: 600; }
  .row .p small { display: block; font-size: 12px; color: var(--label-2); font-family: var(--font); }
  .row .p.best b { color: var(--good); }
  .row .p.best small { color: var(--good); }
  .chev { color: var(--label-3); }
  .badge { font-size: 11px; font-weight: 600; color: var(--label-2); background: var(--fill); padding: 1px 6px; border-radius: 5px; margin-left: 4px; vertical-align: 2px; }

  .note { font-size: 13px; color: var(--label-2); padding: 0 16px; line-height: 1.4; }
  .note a { color: var(--tint); text-decoration: none; }
  .note.err { color: var(--warn); }
  .empty { text-align: center; padding: 28px 16px; color: var(--label-2); font-size: 15px; }
  .demo { font-size: 12px; font-weight: 600; color: var(--warn); background: var(--fill); border-radius: 6px; padding: 2px 8px; }

  @media (prefers-reduced-motion: reduce) { .seg .thumb { transition: none; } }
</style>
</head>
<body>
<main>
  <header class="titlebar">
    <div>
      <h1>Fuel</h1>
      <div class="where" id="where">Find the cheapest pump near you</div>
    </div>
    <span class="demo" id="demoTag" hidden>Sample data</span>
  </header>

  <form class="search" id="searchForm" role="search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5 20 20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    <input id="postcode" placeholder="Postcode" autocomplete="postal-code" enterkeyhint="search" aria-label="Postcode">
    <button class="icon-btn" type="button" id="locate" aria-label="Use my location">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.6 3.4a1 1 0 0 0-1.06-.23L3.66 9.3a1 1 0 0 0 .07 1.89l6.63 2.07 2.07 6.63a1 1 0 0 0 1.89.07l6.12-15.88a1 1 0 0 0-.23-1.06Z"/></svg>
    </button>
  </form>

  <div class="seg" id="seg" role="group" aria-label="Fuel type">
    <span class="thumb" id="thumb"></span>
    <button type="button" data-fuel="E10">Unleaded</button>
    <button type="button" data-fuel="B7_STANDARD">Diesel</button>
    <button type="button" data-fuel="E5">Super</button>
    <button type="button" data-fuel="B7_PREMIUM">Premium</button>
  </div>

  <section class="hero" id="hero" hidden></section>

  <div class="section-head">
    <h2 id="listTitle">Nearby</h2>
    <select class="menu" id="radius" aria-label="Search radius">
      <option value="3">3 miles</option>
      <option value="5" selected>5 miles</option>
      <option value="10">10 miles</option>
      <option value="20">20 miles</option>
    </select>
  </div>
  <div class="group" id="list"><div class="empty">Search a postcode or tap the arrow to use your location.</div></div>

  <p class="note" id="status"></p>
  <p class="note">
    Prices are reported by forecourts to the UK Government Fuel Finder scheme. Always check the pump.
    <a href="https://www.fuel-finder.service.gov.uk/motorist/price-report" target="_blank" rel="noopener">Report a wrong price</a>
  </p>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DEMO = window.FUEL_DEMO || null; // preview hook: { center, near(lat,lng,fuel,radius) }
  let here = null, fuel = "E10";

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const isApple = /iPhone|iPad|Macintosh/.test(navigator.userAgent);
  const mapsUrl = (s) => isApple
    ? `https://maps.apple.com/?daddr=${s.lat},${s.lng}&q=${encodeURIComponent(s.name)}`
    : `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}`;

  function ago(iso) {
    if (!iso) return { t: "time unknown", stale: true };
    const m = Math.max(1, Math.round((Date.now() - new Date(iso)) / 60000));
    if (m < 60) return { t: `${m} min ago`, stale: false };
    if (m < 2880) return { t: `${Math.round(m / 60)} hr ago`, stale: false };
    const d = Math.round(m / 1440);
    return { t: `${d} days ago`, stale: d > 7 };
  }

  function setFuel(f) {
    fuel = f; store.set("fuel", f);
    const btns = [...$("seg").querySelectorAll("button")];
    const i = Math.max(0, btns.findIndex((b) => b.dataset.fuel === f));
    btns.forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
    $("thumb").style.transform = `translateX(${i * 100}%)`;
  }

  function status(msg, err) { $("status").textContent = msg || ""; $("status").className = "note" + (err ? " err" : ""); }

  // ---------- Data: static grid tiles written by scripts/refresh.mjs ----------

  let meta = null;
  const tiles = new Map(); // "key@fetchedAt" -> Promise<stations[]>

  async function loadMeta() {
    if (meta && Date.now() - meta.loadedAt < 5 * 60_000) return meta;
    const res = await fetch("data/meta.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("Price data isn't available yet. Try again in a few minutes.");
    meta = { ...(await res.json()), loadedAt: Date.now() };
    meta.tileSet = new Set(meta.tiles);
    return meta;
  }

  function getTile(key, m) {
    const id = `${key}@${m.fetchedAt}`;
    if (!tiles.has(id)) {
      tiles.set(id, fetch(`data/t/${key}.json?v=${encodeURIComponent(m.fetchedAt)}`)
        .then((r) => { if (!r.ok) throw new Error(`Couldn't load prices (${r.status}). Try again.`); return r.json(); })
        .catch((e) => { tiles.delete(id); throw e; }));
    }
    return tiles.get(id);
  }

  function miles(lat1, lng1, lat2, lng2) {
    const R = 3958.8, toRad = (d) => (d * Math.PI) / 180;
    const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  async function near(lat, lng, fuel, radius) {
    const m = await loadMeta();
    // Every grid cell the radius could reach
    const dLat = radius / 69, dLng = radius / (69 * Math.cos((lat * Math.PI) / 180));
    const keys = [];
    for (let i = Math.floor((lat - dLat) / m.tile.lat); i <= Math.floor((lat + dLat) / m.tile.lat); i++)
      for (let j = Math.floor((lng - dLng) / m.tile.lng); j <= Math.floor((lng + dLng) / m.tile.lng); j++)
        if (m.tileSet.has(`${i}_${j}`)) keys.push(`${i}_${j}`);

    const results = [];
    for (const s of (await Promise.all(keys.map((k) => getTile(k, m)))).flat()) {
      const fp = s.p[fuel];
      if (!fp) continue;
      const d = miles(lat, lng, s.lat, s.lng);
      if (d > radius) continue;
      results.push({
        id: s.id, name: s.name, brand: s.brand, address: s.addr, postcode: s.pc,
        lat: s.lat, lng: s.lng, motorway: s.mway, supermarket: s.smkt,
        price: fp[0], updated: fp[1], miles: Math.round(d * 10) / 10,
      });
    }
    results.sort((a, b) => a.price - b.price || a.miles - b.miles);
    return { fetchedAt: m.fetchedAt, fuel, radius, count: results.length, stations: results.slice(0, 50) };
  }

  async function search() {
    if (!here) return;
    const radius = $("radius").value; store.set("radius", radius);
    $("where").textContent = `Near ${here.label}`;
    status("Loading prices…");
    try {
      const data = DEMO ? DEMO.near(here.lat, here.lng, fuel, Number(radius)) : await near(here.lat, here.lng, fuel, Number(radius));
      render(data, radius);
      status(data.fetchedAt ? `Prices updated at ${new Date(data.fetchedAt).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}.` : "");
    } catch (e) { status(e.message, true); }
  }

  function render(data, radius) {
    const list = data.stations;
    $("listTitle").textContent = list.length ? `${data.count} nearby` : "Nearby";
    if (!list.length) {
      $("hero").hidden = true;
      $("list").innerHTML = `<div class="empty">No stations sell this fuel within ${radius} miles. Try a wider radius.</div>`;
      return;
    }
    const best = list[0];
    const worst = Math.max(...list.map((s) => s.price));
    const save = ((worst - best.price) * 55 / 100).toFixed(2);
    const u = ago(best.updated);
    $("hero").hidden = false;
    $("hero").innerHTML = `
      <div class="eyebrow"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1.2 14.2-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4-7 7Z"/></svg>Cheapest nearby</div>
      <div class="big"><b>${best.price.toFixed(1)}</b><span>p/litre</span></div>
      <div>
        <div class="station">${esc(best.name)}</div>
        <div class="sub">${best.miles} mi · ${esc(best.address)}${best.postcode ? ", " + esc(best.postcode) : ""} · <span style="color:${u.stale ? "var(--warn)" : "inherit"}">${u.t}</span></div>
      </div>
      <div class="actions">
        <a class="pill" href="${mapsUrl(best)}" target="_blank" rel="noopener">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.6 3.4a1 1 0 0 0-1.06-.23L3.66 9.3a1 1 0 0 0 .07 1.89l6.63 2.07 2.07 6.63a1 1 0 0 0 1.89.07l6.12-15.88a1 1 0 0 0-.23-1.06Z"/></svg>Directions</a>
      </div>
      ${Number(save) > 0 ? `<div class="saving">Up to <b>£${save}</b> cheaper than the priciest station here on a 55-litre tank.</div>` : ""}`;

    $("list").innerHTML = list.map((s, i) => {
      const t = ago(s.updated);
      const diff = s.price - best.price;
      const brand = s.brand && !s.name.toLowerCase().includes(s.brand.toLowerCase()) ? ` · ${esc(s.brand)}` : "";
      return `<a class="row" href="${mapsUrl(s)}" target="_blank" rel="noopener">
        <div class="t">
          <div class="name">${esc(s.name)}${s.supermarket ? '<span class="badge">Supermarket</span>' : ""}${s.motorway ? '<span class="badge">Motorway</span>' : ""}</div>
          <div class="meta">${s.miles} mi${brand} · <span class="${t.stale ? "stale" : ""}">${t.t}</span></div>
        </div>
        <div class="p ${i === 0 ? "best" : ""}"><b>${s.price.toFixed(1)}p</b><small>${i === 0 ? "Cheapest" : "+" + diff.toFixed(1) + "p"}</small></div>
        <svg class="chev" width="8" height="13" viewBox="0 0 8 13" fill="none" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>`;
    }).join("");
  }

  async function byPostcode(e) {
    e && e.preventDefault();
    const pc = $("postcode").value.trim();
    if (!pc) return;
    $("postcode").blur();
    if (DEMO) { here = { ...DEMO.center, label: pc.toUpperCase() }; return search(); }
    status("Finding postcode…");
    try {
      const res = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(pc)}`);
      const data = await res.json();
      if (!res.ok || !data.result) throw new Error("We couldn't find that postcode. Check it and try again.");
      store.set("postcode", data.result.postcode);
      $("postcode").value = data.result.postcode;
      here = { lat: data.result.latitude, lng: data.result.longitude, label: data.result.postcode };
      search();
    } catch (err) { status(err.message, true); }
  }

  function locate() {
    if (DEMO) { here = { ...DEMO.center, label: "you" }; $("postcode").value = ""; return search(); }
    if (!navigator.geolocation) return status("Location isn't available here. Search a postcode instead.", true);
    status("Finding your location…");
    navigator.geolocation.getCurrentPosition(
      (p) => { here = { lat: p.coords.latitude, lng: p.coords.longitude, label: "you" }; $("postcode").value = ""; search(); },
      () => status("Location access was turned off. Search a postcode instead.", true),
      { timeout: 10000, maximumAge: 300000 }
    );
  }

  $("seg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { setFuel(b.dataset.fuel); search(); } });
  $("searchForm").addEventListener("submit", byPostcode);
  $("locate").addEventListener("click", locate);
  $("radius").addEventListener("change", search);

  setFuel(store.get("fuel") || "E10");
  $("radius").value = store.get("radius") || "5";
  if (DEMO) { $("demoTag").hidden = false; $("postcode").value = DEMO.center.label; here = { ...DEMO.center }; search(); }
  else if (store.get("postcode")) { $("postcode").value = store.get("postcode"); byPostcode(); }
})();
</script>
</body>
</html>
